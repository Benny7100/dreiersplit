<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#0d0e10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Dreiersplit Training</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0d0e10; --surface: #17191c; --surface-2: #202328; --line: #2b2f36;
  --fg: #f2efe8; --muted: #8d939c; --accent: #ff7a45; --accent-ink: #1a0d06;
  --ok: #7fd1a8; --danger: #ff7b7b;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f1ec; --surface: #ffffff; --surface-2: #ebe9e3; --line: #d9d6ce;
    --fg: #16181b; --muted: #6b7079; --accent: #e5521c; --accent-ink: #ffffff;
    --ok: #1f8a5b; --danger: #c6372f; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f1ec; --surface: #ffffff; --surface-2: #ebe9e3; --line: #d9d6ce;
  --fg: #16181b; --muted: #6b7079; --accent: #e5521c; --accent-ink: #ffffff;
  --ok: #1f8a5b; --danger: #c6372f; color-scheme: light;
}

html { padding-top: env(safe-area-inset-top, 0px); }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 12px; padding-bottom: 150px;
}
main { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2 { font-family: "Big Shoulders Display", "Arial Narrow", sans-serif; font-weight: 800; text-wrap: balance; margin: 0; }
h1 { font-size: 44px; line-height: .95; text-transform: uppercase; }
h2 { font-size: 26px; line-height: 1.05; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; align-items: flex-start; }
.visually { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }

.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.status { font-size: 12px; color: var(--muted); text-align: right; min-height: 1em; }
.status[data-state="err"] { color: var(--danger); }
.status[data-state="ok"] { color: var(--ok); }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.tabs button { min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 600; }
.tabs button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }

.splits { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.split {
  position: relative; min-height: 64px; padding: 10px 8px; border-radius: 12px; background: var(--surface);
  border: 1px solid var(--line); text-align: left; display: grid; align-content: space-between; gap: 4px; min-width: 0;
}
.split[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.split:disabled { opacity: .4; cursor: not-allowed; }
.split b { font-family: "Big Shoulders Display", sans-serif; font-size: 18px; line-height: 1; font-weight: 800; }
.split small { font-size: 12px; color: var(--muted); line-height: 1.2; overflow-wrap: anywhere; }
.badge { position: absolute; top: -8px; right: 6px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); padding: 2px 6px; border-radius: 999px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.banner { border: 1px solid var(--accent); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; background: var(--surface); }
.progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.plan { list-style: none; margin: 0; padding: 0; }
.plan li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.plan li:first-child { border-top: 0; }
.plan li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.datefield { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 14px; }
input[type="date"] { min-height: 40px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; color: var(--fg); }

.primary, .ghost { min-height: 48px; padding: 0 16px; border-radius: 12px; font-weight: 600; font-size: 15px; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; }
.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.primary, .ghost { display: inline-flex; align-items: center; justify-content: center; }
.row > .primary, .row > .ghost { flex: 1 1 auto; }
.summary { border-left: 3px solid var(--ok); padding: 4px 0 4px 12px; color: var(--muted); }
.summary b { color: var(--fg); }

.exlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
.exhead { width: 100%; min-height: 64px; padding: 12px 14px; background: none; border: 0; text-align: left; display: grid; grid-template-columns: 12px minmax(0,1fr) auto; align-items: center; gap: 12px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); box-sizing: border-box; }
.dot.part { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); }
.dot.ok { background: var(--ok); border-color: var(--ok); }
.exname { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.exname small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.exname .sum { color: var(--fg); font-weight: 600; font-size: 16px; }
.exname small.last { color: var(--muted); }
.sugg { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px dashed var(--accent); }
.sugg b { color: var(--accent); }
.bump { display: inline-block; margin-left: 6px; font-size: 11px; letter-spacing: .04em; padding: 1px 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.exmeta { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
.exbody { padding: 0 14px 14px; display: grid; gap: 10px; min-width: 0; }
.sethead, .setrow { display: grid; grid-template-columns: 30px minmax(0,1fr) minmax(0,1fr) 48px 36px; gap: 8px; align-items: center; }
.sethead { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sethead span:nth-child(n+2):nth-child(-n+3) { text-align: center; }
.setno { color: var(--muted); font-variant-numeric: tabular-nums; }
.setrow input { width: 100%; min-width: 0; height: 46px; box-sizing: border-box; font-size: 18px; text-align: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; font-variant-numeric: tabular-nums; }
.check { height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: 20px; font-weight: 700; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.del { height: 36px; background: none; border: 0; color: var(--muted); font-size: 22px; }
.exfoot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.exfoot > * { min-width: 0; white-space: nowrap; font-size: 14px; padding: 0 10px; }
.exfoot > .primary { grid-column: 1 / -1; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
select { min-height: 44px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; color: var(--fg); }

.chart { width: 100%; height: auto; display: block; }
.grid { stroke: var(--line); stroke-width: 1; }
.ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.area { fill: var(--accent); opacity: .12; }
.pt { fill: var(--accent); }
.lbl { fill: var(--fg); font-size: 11px; font-variant-numeric: tabular-nums; }
.axis { fill: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
.bar { fill: var(--accent); }
.bar0 { fill: var(--surface-2); }

.hlist { display: grid; gap: 8px; }
.hcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
.hhead { width: 100%; min-height: 60px; padding: 12px 14px; background: none; border: 0; text-align: left; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 12px; align-items: center; }
.hhead small { color: var(--muted); font-size: 13px; }
.hbody { padding: 0 14px 14px; display: grid; gap: 12px; }
.hline { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 14px; }
.hline span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.hedit { display: grid; gap: 6px; }
.hedit .setrow { grid-template-columns: 26px minmax(0,1fr) minmax(0,1fr); }
.hedit .setrow input { height: 40px; font-size: 16px; }

details { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 0 14px; }
details summary { cursor: pointer; min-height: 48px; display: flex; align-items: center; color: var(--muted); }
details[open] summary { color: var(--fg); }
details .block { display: grid; gap: 10px; padding: 4px 0 16px; }

.timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--surface); border-top: 1px solid var(--accent); display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px 12px; align-items: center; }
.timer > * { min-width: 0; }
.tlabel { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tval { font-family: "Big Shoulders Display", sans-serif; font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.tbtns { display: flex; gap: 6px; }
.tbtns button { min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; }
.tbtns button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tbar { grid-column: 1 / -1; height: 4px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.tbar i { display: block; height: 100%; width: 100%; background: var(--accent); }

@media (max-width: 380px) {
  h1 { font-size: 36px; }
  .sethead, .setrow { grid-template-columns: 24px minmax(0,1fr) minmax(0,1fr) 42px 30px; gap: 6px; }
}
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <div class="eyebrow" id="today"></div>
      <h1>Dreiersplit</h1>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </header>

  <nav class="tabs" aria-label="Ansicht">
    <button type="button" data-act="view" data-v="train" aria-pressed="true">Training</button>
    <button type="button" data-act="view" data-v="hist" aria-pressed="false">Verlauf</button>
  </nav>

  <div id="app"></div>
</main>

<div class="timer" id="timer" hidden role="timer">
  <div class="tlabel" id="tlabel">Pause</div>
  <div class="tval" id="tval">0:00</div>
  <div class="tbtns">
    <button type="button" data-act="t-add">+30 s</button>
    <button type="button" class="primary" data-act="t-stop">Überspringen</button>
  </div>
  <div class="tbar"><i id="tbarfill"></i></div>
</div>

<script>
// ---- Trainingsplan: [Übung, Sätze, Wiederholungen, Gewicht in kg] ----
const SPLITS = [
  { id: 1, name: "Brust · Schulter · Arme", short: "Brust, Schulter, Arme", ex: [
    ["Bankdrücken", 3, 6, 60], ["Langhantel Curls", 3, 6, 30], ["Kurzhantel Brust", 3, 8, 18],
    ["Kurzhantel Curls", 3, 8, 10], ["Kurzhantel Schulter", 2, 8, 7.5], ["Butterfly", 2, 10, 50], ["Curl Maschine", 2, 10, 35]] },
  { id: 2, name: "Beine · Bauch", short: "Beine, Bauch", ex: [
    ["Kniebeugen", 3, 6, 75], ["Beinpresse", 3, 8, 150], ["Beinbeuger", 3, 8, 70],
    ["Beinstrecker", 3, 8, 50], ["Waden Maschine", 3, 15, 60], ["Bauch Maschine", 3, 8, 30]] },
  { id: 3, name: "Rücken · Trizeps", short: "Rücken, Trizeps", ex: [
    ["Kreuzheben", 3, 6, 80], ["Latzug", 3, 8, 70], ["Rudern", 3, 8, 60],
    ["Trizeps Kabelzug", 3, 10, 20], ["Reverse Butterfly", 3, 10, 30], ["Rückenstrecker", 3, 10, null]] },
].map(s => ({ ...s, ex: s.ex.map(([name, sets, reps, kg]) => ({ name, sets, reps, kg })) }));

// Gleiche Schlüssel wie V1, damit deine bisherigen Trainings erhalten bleiben.
const KEY = "dreiersplit-sessions-v1";
const SET_KEY = "dreiersplit-settings-v2";
const LEGACY_REST = "dreiersplit-rest-v1";
const REST_OPTIONS = [60, 90, 120, 180];
const STEP = 2.5;
const STALE_MS = 4 * 3600 * 1000;

const S = {
  view: "train", splitId: 1, openIdx: 0,
  sessions: [], active: null,
  lastSummary: null, finishArmed: false, dismissed: null,
  rest: 90, restByEx: {}, settingsOpen: false, importMsg: "",
  histEx: "Bankdrücken", histOpen: null, editId: null, deleteArmed: null,
};
const timer = { end: 0, total: 0, label: "" };
let audioCtx = null;

// ---- Helfer ----
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayStr = (ts = Date.now()) => new Date(ts).toLocaleDateString("sv-SE");
const fmtNum = n => (n == null || !Number.isFinite(n)) ? "" : String(Math.round(n * 10) / 10).replace(".", ",");
const fmtKg = n => n == null ? "–" : fmtNum(n) + " kg";
const fmtDate = iso => new Date(iso + "T12:00:00").toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "short" });
const fmtDateLong = iso => new Date(iso + "T12:00:00").toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const fmtInt = n => Math.round(n).toLocaleString("de-DE");
const parseKg = v => { const n = parseFloat(String(v).replace(",", ".")); return Number.isFinite(n) ? n : null; };
const parseReps = v => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : null; };
const round1 = n => Math.round(n * 10) / 10;
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const splitById = id => SPLITS.find(s => s.id === id);
const curSplit = () => splitById(S.splitId);
const ALL_EX = SPLITS.flatMap(s => s.ex.map(e => ({ ...e, split: s.id })));
const planText = ex => `${ex.sets} × ${ex.reps}${ex.kg != null ? " · " + fmtKg(ex.kg) : ""}`;
const setStatus = (text, ok = true) => { const el = $("#status"); el.textContent = text; el.dataset.state = ok ? "ok" : "err"; };

function exSummary(sets) {
  const n = sets.length;
  if (!n) return "keine Sätze";
  const reps = sets.map(s => s.reps).filter(v => v != null);
  const kgs = sets.map(s => s.kg).filter(v => v != null);
  const repTxt = reps.length === n && reps.every(v => v === reps[0]) ? `${n} × ${reps[0]}` : `${n} Sätze`;
  let kgTxt = "";
  if (kgs.length) {
    const lo = Math.min(...kgs), hi = Math.max(...kgs);
    kgTxt = lo === hi ? fmtKg(lo) : `${fmtNum(lo)}–${fmtKg(hi)}`;
  }
  return [repTxt, kgTxt].filter(Boolean).join(" · ");
}
function volume(sess) {
  let v = 0;
  for (const e of Object.values(sess.exercises || {})) for (const s of e.sets) if (s.done && s.kg && s.reps) v += s.kg * s.reps;
  return v;
}
function setCount(sess) {
  return Object.values(sess.exercises || {}).flatMap(e => e.sets).filter(s => s.done).length;
}

// ---- Speicher (sofort, lokal auf dem Gerät) ----
function loadAll() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "[]");
    S.sessions = Array.isArray(raw) ? raw : [];
  } catch { S.sessions = []; }
  S.sessions.sort((a, b) => b.startedAt - a.startedAt);
  try {
    const st = JSON.parse(localStorage.getItem(SET_KEY) || "{}");
    S.rest = st.rest ?? (Number(localStorage.getItem(LEGACY_REST)) || 90);
    S.restByEx = st.restByEx ?? {};
  } catch {}
}
function saveAll() {
  try { localStorage.setItem(KEY, JSON.stringify(S.sessions)); return true; } catch { return false; }
}
function saveSettings() {
  try { localStorage.setItem(SET_KEY, JSON.stringify({ rest: S.rest, restByEx: S.restByEx })); } catch {}
}
function commit(sess) {
  if (sess) sess.updatedAt = Date.now();
  const ok = saveAll();
  setStatus(ok ? "✓ gespeichert" : "⚠ nicht gespeichert, Speicher voll?", ok);
}

// ---- Training ----
function setsOf(sess, ex) {
  if (!sess.exercises[ex.name]) sess.exercises[ex.name] = { sets: buildPrefill(ex, null) };
  return sess.exercises[ex.name].sets;
}
function lastFinishedSets(name) {
  for (const s of S.sessions) {
    if (!s.finishedAt) continue;
    const sets = s.exercises?.[name]?.sets;
    if (sets && sets.length) return sets;
  }
  return null;
}
// Startwerte = letztes Training (oder Plan, wenn es noch keins gibt). Nichts wird automatisch erhöht.
function buildPrefill(ex, prev) {
  if (!prev) return Array.from({ length: ex.sets }, () => ({ kg: ex.kg, reps: ex.reps, done: false }));
  return prev.map(p => ({ kg: p.kg, reps: p.reps, done: false }));
}
// Vorschlag nur, wenn im letzten Training alle Sätze geschafft wurden und die Ziel-Wdh erreicht sind.
// Er verschwindet, sobald das Gewicht geändert oder übernommen wurde.
function suggestionFor(ex, prev, sets) {
  if (!prev || !prev.length) return null;
  const hit = prev.every(s => s.done) && prev.every(s => s.reps != null && s.reps >= ex.reps);
  const kgs = prev.map(s => s.kg).filter(v => v != null);
  if (!hit || !kgs.length) return null;
  const prevKg = Math.max(...kgs);
  const unchanged = sets.every(s => s.kg == null || s.kg === prevKg);
  return unchanged ? round1(prevKg + STEP) : null;
}
function startSession() {
  const sp = curSplit();
  const sess = { id: newId(), split: sp.id, startedAt: Date.now(), date: todayStr(), finishedAt: null, updatedAt: Date.now(), exercises: {} };
  for (const ex of sp.ex) {
    sess.exercises[ex.name] = { sets: buildPrefill(ex, lastFinishedSets(ex.name)) };
  }
  S.sessions.unshift(sess);
  S.active = sess; S.openIdx = 0; S.lastSummary = null; S.dismissed = null;
  commit(sess); render();
}
function finishSession(force = false) {
  if (!force && !S.finishArmed) {
    S.finishArmed = true; render();
    setTimeout(() => { if (S.finishArmed) { S.finishArmed = false; render(); } }, 3500);
    return;
  }
  const sess = S.active;
  sess.finishedAt = Date.now();
  S.lastSummary = { sets: setCount(sess), vol: volume(sess) };
  S.active = null; S.finishArmed = false;
  commit(sess); render();
}
function restFor(name) { return S.restByEx[name] ?? S.rest; }
function firstOpenIdx(sess, sp) {
  const i = sp.ex.findIndex(ex => { const sets = sess.exercises[ex.name]?.sets || []; return !(sets.length && sets.every(s => s.done)); });
  return i < 0 ? sp.ex.length - 1 : i;
}
function updateExHeader(i) {
  const ex = curSplit().ex[i];
  const sets = setsOf(S.active, ex);
  const sum = document.querySelector(`[data-sum="${i}"]`);
  if (sum) sum.textContent = exSummary(sets);
  const cnt = document.querySelector(`[data-cnt="${i}"]`);
  if (cnt) cnt.textContent = `${sets.filter(s => s.done).length}/${sets.length}`;
  const sg = document.querySelector(`[data-sugg="${i}"]`);
  if (sg) {
    const v = suggestionFor(ex, lastFinishedSets(ex.name), sets);
    sg.hidden = v == null;
    const vt = sg.querySelector("[data-suggval]");
    if (vt && v != null) vt.textContent = fmtKg(v);
  }
  const dot = document.querySelector(`[data-dot="${i}"]`);
  if (dot) {
    const dn = sets.filter(s => s.done).length;
    dot.className = "dot " + (sets.length && dn === sets.length ? "ok" : dn ? "part" : "");
  }
}

// ---- Pausen-Timer ----
function ensureAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch {}
}
function beep() {
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; g.gain.value = 0.2;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.35);
  } catch {}
}
function startTimer(sec, label) {
  ensureAudio();
  timer.end = Date.now() + sec * 1000; timer.total = sec; timer.label = label;
  drawTimer();
}
function drawTimer() {
  const el = $("#timer");
  if (!timer.end) { el.hidden = true; return; }
  const ms = timer.end - Date.now();
  if (ms <= 0) {
    timer.end = 0; el.hidden = true; beep();
    try { navigator.vibrate?.([250, 120, 250]); } catch {}
    return;
  }
  el.hidden = false;
  const s = Math.ceil(ms / 1000);
  $("#tlabel").textContent = timer.label;
  $("#tval").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  $("#tbarfill").style.width = (ms / (timer.total * 1000) * 100).toFixed(2) + "%";
}

// ---- Verlauf: Diagramme ----
function progressChart(exName) {
  const pts = [];
  for (const s of [...S.sessions].reverse()) {
    if (!s.finishedAt) continue;
    const sets = s.exercises?.[exName]?.sets || [];
    const kgs = sets.filter(x => x.done && x.kg != null).map(x => x.kg);
    if (kgs.length) pts.push({ date: s.date, top: Math.max(...kgs) });
  }
  if (pts.length < 2) {
    return `<p class="muted small">Für die Kurve braucht es mindestens 2 abgeschlossene Trainings mit dieser Übung. Bisher: ${pts.length}.</p>`;
  }
  const W = 340, H = 180, L = 36, R = 14, T = 16, B = 26;
  let lo = Math.min(...pts.map(p => p.top)), hi = Math.max(...pts.map(p => p.top));
  if (lo === hi) { lo -= 5; hi += 5; } else { const pad = (hi - lo) * 0.15; lo -= pad; hi += pad; }
  const x = i => L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const grid = [0, 1, 2, 3].map(k => {
    const v = lo + k * (hi - lo) / 3;
    return `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${fmtNum(v)}</text>`;
  }).join("");
  const coords = pts.map((p, i) => `${x(i)},${y(p.top)}`);
  const area = `M${x(0)},${H - B} L${coords.join(" L")} L${x(pts.length - 1)},${H - B} Z`;
  const showAll = pts.length <= 12;
  const dots = pts.map((p, i) => `<circle class="pt" cx="${x(i)}" cy="${y(p.top)}" r="4"/>` +
    (showAll || i === pts.length - 1 ? `<text class="lbl" x="${x(i)}" y="${y(p.top) - 9}" text-anchor="middle">${fmtNum(p.top)}</text>` : "")).join("");
  const first = pts[0], last = pts[pts.length - 1];
  const delta = round1(last.top - first.top);
  const dTxt = delta > 0 ? `+${fmtNum(delta)} kg` : delta < 0 ? `${fmtNum(delta)} kg` : "unverändert";
  return `
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf des Top-Gewichts">
      ${grid}
      <path class="area" d="${area}"/>
      <polyline class="ln" points="${coords.join(" ")}"/>
      ${dots}
      <text class="axis" x="${L}" y="${H - 6}">${fmtDate(first.date)}</text>
      <text class="axis" x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(last.date)}</text>
    </svg>
    <p class="small num" style="margin:0">Start ${fmtKg(first.top)} · jetzt ${fmtKg(last.top)} · <b>${dTxt}</b></p>`;
}
function volumeChart() {
  const weeks = [];
  const monday = iso => {
    const d = new Date(iso + "T12:00:00");
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return todayStr(d.getTime());
  };
  const thisMon = monday(todayStr());
  const base = new Date(thisMon + "T12:00:00");
  for (let k = 11; k >= 0; k--) {
    const d = new Date(base); d.setDate(d.getDate() - 7 * k);
    weeks.push(todayStr(d.getTime()));
  }
  const vals = weeks.map(() => 0);
  for (const s of S.sessions) {
    if (!s.finishedAt) continue;
    const idx = weeks.indexOf(monday(s.date));
    if (idx >= 0) vals[idx] += volume(s);
  }
  const max = Math.max(...vals, 1);
  const W = 340, H = 150, L = 4, R = 4, T = 10, B = 22;
  const bw = (W - L - R) / weeks.length;
  const bars = vals.map((v, i) => {
    const h = v / max * (H - T - B);
    const cx = L + i * bw + bw * 0.15;
    const w = bw * 0.7;
    const label = (i % 3 === 0 || i === weeks.length - 1)
      ? `<text class="axis" x="${cx + w / 2}" y="${H - 6}" text-anchor="middle">${new Date(weeks[i] + "T12:00:00").toLocaleDateString("de-DE", { day: "numeric", month: "numeric" })}</text>` : "";
    return `<rect class="${v > 0 ? "bar" : "bar0"}" x="${cx}" y="${H - B - Math.max(h, 2)}" width="${w}" height="${Math.max(h, 2)}" rx="3"/>${label}`;
  }).join("");
  const total = vals.reduce((a, b) => a + b, 0);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Wochenvolumen">${bars}</svg>
    <p class="small muted num" style="margin:0">Gesamt letzte 12 Wochen: ${fmtInt(total)} kg</p>`;
}

  const head = `<button class="exhead" type="button" data-act="open" data-i="${i}" aria-expanded="${open}">

}

function suggestSplit() {
  const last = { 1: 0, 2: 0, 3: 0 };
  for (const s of S.sessions) if (s.finishedAt) last[s.split] = Math.max(last[s.split], s.startedAt || 0);
  return Number(Object.keys(last).sort((a, b) => last[a] - last[b] || a - b)[0]);
}
function render() {
  $("#today").textContent = new Date().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
  document.querySelectorAll('[data-act="view"]').forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === S.view)));
  $("#app").innerHTML = S.view === "train" ? trainHtml() : histHtml();
}

// ---- Backup ----
function exportBackup() {
  const data = { app: "dreiersplit", version: 2, exportedAt: new Date().toISOString(), sessions: S.sessions, settings: { rest: S.rest, restByEx: S.restByEx } };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = `dreiersplit-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  setStatus("Backup erstellt");
}
async function importFile(file) {
  try {
    const data = JSON.parse(await file.text());
    const incoming = Array.isArray(data) ? data : data.sessions;
    if (!Array.isArray(incoming)) throw new Error("format");
    const map = new Map(S.sessions.map(s => [s.id, s]));
    let added = 0, updated = 0;
    for (const s of incoming) {
      if (!s || !s.id) continue;
      const cur = map.get(s.id);
      if (!cur) { map.set(s.id, s); added++; }
      else if ((s.updatedAt || 0) > (cur.updatedAt || 0)) { map.set(s.id, s); updated++; }
    }
    S.sessions = [...map.values()].sort((a, b) => b.startedAt - a.startedAt);
    S.active = S.sessions.find(s => !s.finishedAt) || null;
    if (S.active) S.splitId = S.active.split;
    if (data.settings) {
      S.rest = data.settings.rest ?? S.rest;
      S.restByEx = { ...S.restByEx, ...(data.settings.restByEx || {}) };
      saveSettings();
    }
    saveAll();
    S.importMsg = `Importiert: ${added} neu, ${updated} aktualisiert.`;
    setStatus("Import fertig");
  } catch {
    S.importMsg = "Die Datei passt nicht zum Backup.";
    setStatus("Import fehlgeschlagen", false);
  }
  render();
}

// ---- Events ----
document.addEventListener("click", e => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act, i = Number(btn.dataset.i), j = Number(btn.dataset.j);
  switch (act) {
    case "view": S.view = btn.dataset.v; render(); break;
    case "split": if (!S.active) { S.splitId = Number(btn.dataset.id); S.openIdx = 0; S.lastSummary = null; render(); } break;
    case "start": startSession(); break;
    case "open": S.openIdx = S.openIdx === i ? -1 : i; render(); break;
    case "done": {
      const ex = curSplit().ex[i];
      const sets = setsOf(S.active, ex);
      sets[j].done = !sets[j].done;
      if (sets[j].done && j < sets.length - 1) startTimer(restFor(ex.name), "Pause · nach Satz " + (j + 1));
      commit(S.active); render(); break;
    }
    case "add": {
      const sets = setsOf(S.active, curSplit().ex[i]);
      const last = sets[sets.length - 1] || {};
      sets.push({ kg: last.kg ?? null, reps: last.reps ?? null, done: false });
      commit(S.active); render(); break;
    }
    case "del": {
      const sets = setsOf(S.active, curSplit().ex[i]);
      if (sets.length > 1) { sets.splice(j, 1); commit(S.active); render(); }
      break;
    }
    case "next": S.openIdx = i + 1; startTimer(120, "Pause · nächste Übung"); render(); break;
    case "apply": {
      const ex = curSplit().ex[i];
      const sets = setsOf(S.active, ex);
      const v = suggestionFor(ex, lastFinishedSets(ex.name), sets);
      if (v == null) break;
      sets.forEach(s => { s.kg = v; });
      commit(S.active); render(); break;
    }
    case "restex": {
      const name = curSplit().ex[i].name;
      const cur = restFor(name);
      const idx = REST_OPTIONS.indexOf(cur);
      S.restByEx[name] = REST_OPTIONS[(idx + 1) % REST_OPTIONS.length];
      saveSettings(); render(); break;
    }
    case "finish": finishSession(); break;
    case "finish-now": finishSession(true); break;
    case "dismiss": S.dismissed = S.active.id; render(); break;
    case "rest": S.rest = Number(btn.dataset.r); saveSettings(); render(); break;
    case "t-add": if (timer.end) { timer.end += 30000; timer.total += 30; drawTimer(); } break;
    case "t-stop": timer.end = 0; drawTimer(); break;
    case "hist-open": S.histOpen = S.histOpen === btn.dataset.id ? null : btn.dataset.id; S.editId = null; S.deleteArmed = null; render(); break;
    case "hist-edit": S.editId = btn.dataset.id; S.deleteArmed = null; render(); break;
    case "hist-editdone": S.editId = null; render(); break;
    case "hist-del": {
      const id = btn.dataset.id;
      if (S.deleteArmed !== id) {
        S.deleteArmed = id; render();
        setTimeout(() => { if (S.deleteArmed === id) { S.deleteArmed = null; render(); } }, 3500);
        break;
      }
      S.sessions = S.sessions.filter(s => s.id !== id);
      S.deleteArmed = null; S.editId = null; S.histOpen = null;
      saveAll(); setStatus("Training gelöscht"); render(); break;
    }
    case "export": exportBackup(); break;
  }
});
document.addEventListener("input", e => {
  const t = e.target, f = t.dataset.f;
  if (f !== "kg" && f !== "reps") return;
  const val = f === "kg" ? parseKg(t.value) : parseReps(t.value);
  if (t.dataset.sid) {
    const sess = S.sessions.find(s => s.id === t.dataset.sid);
    const set = sess?.exercises[t.dataset.name]?.sets?.[Number(t.dataset.j)];
    if (!set) return;
    set[f] = val; commit(sess); return;
  }
  if (!S.active) return;
  const i = Number(t.dataset.i), j = Number(t.dataset.j);
  setsOf(S.active, curSplit().ex[i])[j][f] = val;
  commit(S.active);
  updateExHeader(i);
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.f === "histEx") { S.histEx = t.value; render(); return; }
  if (t.dataset.f === "date" && S.active) { S.active.date = t.value || S.active.date; commit(S.active); render(); return; }
  if (t.dataset.hdate) {
    const sess = S.sessions.find(s => s.id === t.dataset.hdate);
    if (sess && t.value) { sess.date = t.value; commit(sess); render(); }
    return;
  }
  if (t.id === "importFile" && t.files[0]) importFile(t.files[0]);
});
document.addEventListener("toggle", e => {
  if (e.target.id === "settings") S.settingsOpen = e.target.open;
}, true);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

// ---- Start ----
loadAll();
S.active = S.sessions.find(s => !s.finishedAt) || null;
if (S.active) { S.splitId = S.active.split; S.openIdx = firstOpenIdx(S.active, curSplit()); }
else S.splitId = suggestSplit();
setInterval(drawTimer, 250);
render();
setStatus("");
</script>
</body>
</html>
